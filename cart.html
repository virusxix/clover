<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE CLOVER | Cart</title>
  <link rel="icon" href="assets/logo-icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css?v=6" />
  <link rel="stylesheet" href="css/vegety.css?v=11" />
  <link rel="stylesheet" href="css/layout.css?v=5" />
  <link rel="stylesheet" href="css/nav.css?v=2" />
  <link rel="stylesheet" href="css/design-system.css?v=1" />
</head>
<body data-page="cart" class="theme-vegety">
  <div class="page-wrap">
    <div class="shell">
      <div id="site-header"></div>
      <main class="body-inner">
        <div class="page-hero"><h1>Your Cart</h1></div>
        <div class="cart-layout">
          <div id="cartContent"></div>
          <aside class="order-summary" id="cartSummary" hidden>
            <h2>Order summary</h2>
            <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">$0</span></div>
            <div class="summary-row"><span>Shipping</span><span id="sumShipping">$0</span></div>
            <div class="summary-row"><span>Tax</span><span id="sumTax">$0</span></div>
            <div class="summary-row summary-row--total"><span>Total</span><span id="sumTotal">$0</span></div>
            <a href="checkout.html" class="btn btn--primary btn--block">Checkout</a>
            <p class="summary-note">Free shipping on orders over $150</p>
          </aside>
        </div>
      </main>
      <footer class="footer"><p class="footer__bottom">© 2026 THE CLOVER</p></footer>
    </div>
  </div>
  <script src="js/catalog-data.js"></script>
  <script src="js/store.js?v=3"></script>
  <script src="js/cart.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/site.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
