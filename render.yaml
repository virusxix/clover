# THE CLOVER — Render Blueprint
# ==============================
# BACKEND ONLY — do not add a Next.js / apps/web service here.
# Frontend = Vercel (DEPLOY-VERCEL.md). API = this file.
#
# If an old "clover-web" service still appears in the Render dashboard,
# delete it manually (Blueprint sync does not always remove old services).
#
# After deploy: set DATABASE_URL + CLIENT_URL (your Vercel site URL).

services:
  - type: web
    name: clover-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: DATABASE_URL
        sync: false
      # Vercel storefront origin, e.g. https://clover-website-omega.vercel.app
      - key: CLIENT_URL
        sync: false
      - key: CORS_VERCEL_PREVIEWS
        value: "true"
