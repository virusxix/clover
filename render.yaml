# THE CLOVER — Render Blueprint (API only)
# Frontend deploys on Vercel — see DEPLOY-VERCEL.md
# Dashboard: New → Blueprint → connect github.com/virusxix/clover
# After first deploy: set DATABASE_URL + CLIENT_URL (your Vercel site URL).

services:
  - type: web
    name: clover-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: DATABASE_URL
        sync: false
      # Your Vercel storefront origin, e.g. https://clover.vercel.app
      - key: CLIENT_URL
        sync: false
      # Optional: allow all *.vercel.app preview deploys
      - key: CORS_VERCEL_PREVIEWS
        value: "true"
