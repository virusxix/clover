<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE CLOVER | Contact</title>
  <link rel="icon" href="assets/logo-icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css?v=6" />
  <link rel="stylesheet" href="css/vegety.css?v=11" />
  <link rel="stylesheet" href="css/layout.css?v=5" />
  <link rel="stylesheet" href="css/nav.css?v=2" />
  <link rel="stylesheet" href="css/design-system.css?v=1" />
</head>
<body data-page="contact" class="theme-vegety">
  <div class="page-wrap">
    <div class="shell">
      <div id="site-header"></div>
      <main class="body-inner">
        <div class="page-hero"><h1 data-ve="contact.title">Contact Us</h1><p data-ve="contact.subtitle">We're here to help with orders, sizing, and more.</p></div>
        <div class="contact-grid">
          <div class="contact-info">
            <h2>Get in touch</h2>
            <div class="contact-item"><strong>Email</strong><a href="mailto:support@theclover.com">support@theclover.com</a></div>
            <div class="contact-item"><strong>Phone</strong><span>+1 (800) 555-CLOVER</span></div>
            <div class="contact-item"><strong>Hours</strong><span>Mon–Fri, 9am–6pm PST</span></div>
            <div class="contact-item"><strong>Flagship</strong><span>2840 Performance Ave, Los Angeles, CA</span></div>
          </div>
          <form class="contact-form" id="contactForm">
            <div class="form-row form-row--half">
              <div><label for="fname">First name</label><input type="text" id="fname" required /></div>
              <div><label for="lname">Last name</label><input type="text" id="lname" required /></div>
            </div>
            <div class="form-row"><label for="email">Email</label><input type="email" id="email" required /></div>
            <div class="form-row"><label for="message">Message</label><textarea id="message" required></textarea></div>
            <button type="submit" class="btn btn--primary">Send message</button>
            <p class="form-success" id="formSuccess">Thanks! We'll reply within 24 hours.</p>
          </form>
        </div>
      </main>
      <footer class="footer"><p class="footer__bottom">© 2026 THE CLOVER</p></footer>
    </div>
  </div>
  <script src="js/catalog-data.js"></script>
  <script src="js/store.js?v=7"></script>
  <script src="js/admin-settings.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/visual-editor-publish.js"></script>
  <script src="js/admin-media.js"></script>
  <script src="js/site-content.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/site.js"></script>
  <script src="js/visual-editor.js"></script>
  <script>
    document.getElementById("contactForm")?.addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("formSuccess")?.classList.add("is-visible");
      e.target.reset();
    });
  </script>
</body>
</html>
