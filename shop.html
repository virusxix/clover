<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE CLOVER | Shop</title>
  <link rel="icon" href="assets/logo-icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css?v=6" />
  <link rel="stylesheet" href="css/vegety.css?v=11" />
  <link rel="stylesheet" href="css/layout.css?v=5" />
  <link rel="stylesheet" href="css/nav.css?v=2" />
  <link rel="stylesheet" href="css/design-system.css?v=1" />
</head>
<body data-page="shop" class="theme-vegety">
  <div class="page-wrap">
    <div class="shell">
      <div id="site-header"></div>
      <main class="body-inner">
        <div class="page-hero">
          <span class="veg-eyebrow" data-ve="shop.eyebrow">All collections</span>
          <h1 class="veg-section-title" data-ve="shop.title">Shop Gear</h1>
          <p data-ve="shop.subtitle">Compression, hoodies, shorts & training essentials.</p>
        </div>
        <div class="shop-toolbar--extended">
          <input type="search" class="shop-search" id="shopSearch" placeholder="Search products…" aria-label="Search products" />
          <label style="display:flex;align-items:center;gap:0.35rem;font-size:0.85rem;color:var(--text-muted)">
            <input type="checkbox" id="filterInStock" /> In stock
          </label>
          <select id="filterMaxPrice" aria-label="Max price" style="height:44px;border-radius:100px;border:1px solid var(--border);padding:0 1rem">
            <option value="">Any price</option>
            <option value="70">Under $70</option>
            <option value="100">Under $100</option>
            <option value="150">Under $150</option>
          </select>
        </div>
        <div class="shop-toolbar" id="shopFilters"></div>
        <div class="product-grid" id="shopGrid"></div>
      </main>
      <footer class="veg-footer">
        <div class="veg-footer__bottom" style="border:none;padding-top:0">
          <p>© 2026 THE CLOVER</p>
          <a href="index.html">Home</a>
        </div>
      </footer>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/catalog-data.js"></script>
  <script src="js/store.js?v=7"></script>
  <script src="js/admin-settings.js"></script>
  <script src="js/admin-media.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/visual-editor-publish.js"></script>
  <script src="js/admin-media.js"></script>
  <script src="js/site-content.js?v=3"></script>
  <script src="js/site.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/visual-editor.js"></script>
</body>
</html>
